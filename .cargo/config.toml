# Windows (MSVC) では C ランタイムを実行ファイルに静的リンクする。
# これで VCRUNTIME140.dll などが入っていない PC でも、exe 1つだけで起動できる。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Linux から MinGW で Windows 向けにクロスビルドするとき (`make windows`。docs/dev-environment.md)。
# MSVC と同じく exe 1つで動くよう C ランタイムを静的リンクし (libstdc++ の静的リンクは開発コンテナの側で)、MinGW の静的ライブラリに付いてくる
# デバッグ情報で exe が数百 MB にならないよう、シンボルを落とす。
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static", "-C", "strip=symbols"]

# xz (liblzma) はシステムのものを探さず、ソースからビルドして静的リンクする。
# macOS の CI では Homebrew の liblzma.dylib に依存してしまい、Homebrew のない Mac で起動できなくなるため。
[env]
LZMA_API_STATIC = "1"

# 画面での動作確認: `cargo ui-check` (後ろに --only 名前 / --update などを付けられる。docs/ui-check.md)
# 開発ビルドで動かす。Windows のリリースビルドはコンソールを持たず、結果の要約が端末に出ないため
[alias]
ui-check = ["run", "--locked", "--", "--ui-check"]
