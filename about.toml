# cargo-about の設定。配布物とアプリに入れる第三者ライセンス一覧を作る。
# 作り直し: tools/licenses/generate.sh
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
# 配布物に入るものだけを数える (テスト用の依存は除く)
ignore-dev-dependencies = true
ignore-build-dependencies = false
