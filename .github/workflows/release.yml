# Windows / macOS 向けの配布パッケージを作り、GitHub Release に置く。
#
# - タグ v* を push すると: ビルド → Release を作成してパッケージを添付
# - Actions タブから手動実行 / PR でこのファイル等を変えたとき: ビルドだけ行い、成果物を Actions の Artifacts に置く
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: cad_proto

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package (.zip)
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $dir = "cadsim-$ver-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/release/$env:APP_NAME.exe" $dir
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "PKG=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.PKG }}

  macos:
    name: macOS (Universal: Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 / x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package (.app を .zip に固める)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then ver="$GITHUB_REF_NAME"; else ver="dev"; fi
          app="CAD Prototype.app"
          mkdir -p "$app/Contents/MacOS"
          # 2つのアーキテクチャを1つのユニバーサルバイナリにまとめる
          lipo -create -output "$app/Contents/MacOS/$APP_NAME" \
            "target/aarch64-apple-darwin/release/$APP_NAME" \
            "target/x86_64-apple-darwin/release/$APP_NAME"
          if [ "$ver" = "dev" ]; then plist_ver="0.0.0"; else plist_ver="${ver#v}"; fi
          sed "s/__VERSION__/$plist_ver/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # 署名なしだと Apple Silicon で起動できないため、アドホック署名だけ付ける
          codesign --force --deep --sign - "$app"
          pkg="cadsim-$ver-macos-universal.zip"
          ditto -c -k --keepParent "$app" "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.PKG }}

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
