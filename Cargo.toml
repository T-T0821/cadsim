[package]
name = "cad_proto"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
# 3D ファイルの読み書き (glTF / GLB, OBJ, STL)。すべて純 Rust
gltf = { version = "1.4", features = ["import", "names", "utils", "extras"] }
rfd = "0.17.2"
ruststep = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stl_io = "0.11"
tobj = { version = "4", default-features = false }
transform-gizmo = "0.11"
truck-meshalgo = "0.4"
truck-modeling = "0.6"
truck-stepio = "0.3"
truck-topology = "0.6"
# OpenUSD (.usda / .usdc / .usdz) の読み書き。純 Rust
openusd = "0.8"
rust_xlsxwriter = "0.102"

# 開発ビルドでも Bevy などの依存は最適化して、操作を軽くする
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
