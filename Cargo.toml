[package]
name = "cad_proto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/cadsim_core", "crates/cadsim_io"]
# 引数なしの cargo test / clippy でワークスペースの全 crate を確かめる
default-members = [".", "crates/cadsim_core", "crates/cadsim_io"]

[dependencies]
cadsim_core = { path = "crates/cadsim_core" }
cadsim_io = { path = "crates/cadsim_io" }
bevy = "0.20"
bevy_egui = "0.43"
rfd = "0.17.2"
ruststep = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
transform-gizmo = "0.11"
truck-meshalgo = "0.4"
truck-modeling = "0.6"
truck-stepio = "0.3"
truck-topology = "0.6"
glam = { version = "0.33.12", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
truck-shapeops = { version = "0.4", default-features = false }
lopdf = "0.46"
krilla = "0.8"
rust_xlsxwriter = "0.102"
e57 = "0.11"
rapier3d = "0.36"

[dev-dependencies]
cadsim_io = { path = "crates/cadsim_io", features = ["test-util"] }

# 開発ビルドでも Bevy などの依存は最適化して、操作を軽くする
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
