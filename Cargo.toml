[package]
name = "plantwright"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/plantwright_core"]
# 引数なしの cargo test / clippy でワークスペースの全 crate を確かめる
default-members = [".", "crates/plantwright_core"]

[build-dependencies]
# Windows の .exe にアイコンを埋め込む (build.rs)
winresource = "0.1"

[dependencies]
plantwright_core = { path = "crates/plantwright_core" }
bevy = "0.20"
bevy_egui = "0.43"
# ウィンドウのアイコンを付けるためだけに使う。Bevy が使っている winit と同じ版にする
winit = { version = "0.30", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
transform-gizmo = "0.11"
glam = { version = "0.33.12", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.46"
krilla = "0.8"
rust_xlsxwriter = "0.102"
e57 = "0.11"
# 物理演算: Bevy の物理プラグイン (中身は Rapier)。描画やピッキングの機能は使わない
bevy_rapier3d = { version = "0.37", default-features = false, features = ["dim3"] }
encoding_rs = "0.8"

[dev-dependencies]
plantwright_core = { path = "crates/plantwright_core", features = ["test-util"] }

# 開発ビルドでも Bevy などの依存は最適化して、操作を軽くする
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
