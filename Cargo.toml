[package]
name = "cad_proto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/cadsim_core"]
# 引数なしの cargo test / clippy でワークスペースの全 crate を確かめる
default-members = [".", "crates/cadsim_core"]

[dependencies]
cadsim_core = { path = "crates/cadsim_core" }
bevy = "0.20"
bevy_egui = "0.43"
# 3D ファイルの読み書き (glTF / GLB, OBJ, STL)。すべて純 Rust
gltf = { version = "1.4", features = ["import", "names", "utils", "extras"] }
rfd = "0.17.2"
ruststep = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stl_io = "0.11"
# PLC との Modbus TCP 通信。純 Rust
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-sync"] }
tobj = { version = "4", default-features = false }
transform-gizmo = "0.11"
truck-meshalgo = "0.4"
truck-modeling = "0.6"
truck-stepio = "0.3"
truck-topology = "0.6"
# OpenUSD (.usda / .usdc / .usdz) の読み書き。純 Rust
openusd = "0.8"
glam = { version = "0.33.12", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
truck-shapeops = { version = "0.4", default-features = false }
lopdf = "0.46"
krilla = "0.8"
rust_xlsxwriter = "0.102"
e57 = "0.11"
rapier3d = "0.36"
# PLC との OPC UA 通信 (クライアントのみ)。純 Rust
async-opcua = { version = "0.19", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["rt", "time"] }
encoding_rs = "0.8"

[dev-dependencies]
# テストで Modbus TCP サーバー (PLC の代わり) を立てる
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-sync", "tcp-server"] }

# 開発ビルドでも Bevy などの依存は最適化して、操作を軽くする
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
