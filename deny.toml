# cargo-deny の設定。依存クレートのライセンスと取得元を確かめる。
# 手元では `cargo deny check licenses sources bans` で実行する。
# 方針は docs/licenses.md を見てください。

[graph]
all-features = false

[licenses]
# 配布物に入れてよいライセンス。ここにないライセンスの依存が入ると失敗する
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # egui に入っている既定フォント (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # ファイル単位のコピーレフト。改変せずに使う限りはライセンス表示だけでよい
    # (async-opcua, smartstring)。改変するときは docs/licenses.md を見る
    "MPL-2.0",
]
confidence-threshold = 0.9


[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
