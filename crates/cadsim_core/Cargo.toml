[package]
name = "cadsim_core"
version = "0.1.0"
edition = "2024"
description = "cadsim のドメインとユースケース。Bevy・egui・ファイル形式のライブラリに依存しない"

[dependencies]
# Bevy 0.20 (bevy_math) と同じ版にして、ベクトル・行列の型をそのまま受け渡せるようにする
glam = "0.33"
# 形状カーネル (B-rep とテッセレーション)
truck-meshalgo = "0.4"
truck-modeling = "0.6"
truck-topology = "0.6"
# B-rep の曲線・曲面の型 (Curve3D / Surface) だけを使う。STEP の読み込みは cadsim_io
truck-stepio = "0.3"

