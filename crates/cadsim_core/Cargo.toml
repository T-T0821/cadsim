[package]
name = "cadsim_core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "plantwright のドメインとユースケース。Bevy・egui・ファイル形式のライブラリに依存しない"

[dependencies]
# Bevy 0.20 (bevy_math) と同じ版にして、ベクトル・行列の型をそのまま受け渡せるようにする
glam = "0.33"
# 干渉チェックの検索木 (三角形の外接箱の BVH)。純 Rust
parry3d-f64 = "0.31"
# 形状カーネル (B-rep とテッセレーション)
truck-meshalgo = "0.4"
truck-modeling = "0.6"
# ブーリアン (和・差・積)
truck-shapeops = { version = "0.4", default-features = false }
truck-topology = "0.6"
# B-rep の曲線・曲面の型 (Curve3D / Surface) だけを使う。STEP の読み込みは cadsim_io
truck-stepio = "0.3"

